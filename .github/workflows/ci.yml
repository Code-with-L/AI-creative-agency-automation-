name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m pytest -q
      - name: Tuned eval harness
        run: python scripts/eval_harness.py --split tuned
      - name: Heldout eval harness
        run: python scripts/eval_harness.py --split heldout

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env is not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked in git"
            exit 1
          fi
      - name: No Google API key-like strings in tracked files
        run: |
          if git grep -n -E 'AIza[0-9A-Za-z_-]{35}'; then
            echo "::error::Google API key-like string tracked"
            exit 1
          fi
